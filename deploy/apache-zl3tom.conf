<VirtualHost *:80>
    ServerName zl3tom.com
    ServerAlias www.zl3tom.com

    ProxyPreserveHost On

    # Avon Toastmasters runs as its own Node.js app on port 3001.
    # Keep this rule BEFORE the catch-all ZL3TOM proxy.
    RedirectMatch 301 ^/avontm$ /avontm/
    ProxyPass /avontm/ http://127.0.0.1:3001/
    ProxyPassReverse /avontm/ http://127.0.0.1:3001/

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/zl3tom-error.log
    CustomLog ${APACHE_LOG_DIR}/zl3tom-access.log combined
</VirtualHost>
